name: One-time Telegram example test
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-smoke.yml]
permissions:
  contents: read
concurrency:
  group: gongibot-production
  cancel-in-progress: false
jobs:
  send-example:
    if: github.event.head_commit.message == 'test: send example 3178545 once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Send five date messages to configured Telegram destinations
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          from deadline_schedule import fetch_article, parse_schedule, render_messages
          from telegram_delivery import send_message

          def run():
              token = os.environ.get("TELEGRAM_TOKEN", "")
              chats = list(dict.fromkeys(c.strip() for c in os.environ.get("TELEGRAM_CHAT", "").split(",") if c.strip()))
              if not token or not chats:
                  raise ValueError("Telegram configuration is missing")
              paths = [Path("seen_posts.json"), Path("deadline_state.json")]
              before = [p.read_bytes() for p in paths]
              article = fetch_article("3178545")
              jobs = parse_schedule(article.html, article.published, article.url)
              expected = json.loads(Path("tests/example_expected.json").read_text(encoding="utf-8"))
              actual = [[j.deadline.isoformat(), j.company, j.url.rsplit("/", 1)[-1],
                         j.duties, j.employment] for j in jobs]
              if actual != expected:
                  raise ValueError("Live example differs from the reviewed preview")
              messages = render_messages(jobs, article.url)
              if len(jobs) != 22 or len(messages) != 5:
                  raise ValueError("Unexpected example message count")
              sent = 0
              for destination, chat in enumerate(chats, 1):
                  for index, message in enumerate(messages, 1):
                      send_message(token, chat, message["text"], attempts=1)
                      sent += 1
                      print(f"Confirmed: destination {destination}, message {index}/5 ({message['deadline']})", flush=True)
                      time.sleep(3)
              if [p.read_bytes() for p in paths] != before:
                  raise ValueError("Production history changed")
              summary = f"Telegram confirmed {sent} messages across {len(chats)} destinations. Example: 22 jobs in 5 date messages. Production history unchanged."
              print(summary, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(summary + "\n")

          try:
              run()
          except Exception as exc:
              print(f"Test stopped ({type(exc).__name__}); inspect confirmed counts before retrying.", flush=True)
              raise SystemExit(1) from None
          PY
      - name: Verify production state remains unchanged
        if: always()
        run: git diff --exit-code -- seen_posts.json deadline_state.json
